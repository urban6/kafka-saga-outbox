plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
	group = 'com.urban6'
	version = '0.0.1'

	repositories {
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'

	dependencyManagement {
		imports {
			mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
		}
	}

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	dependencies {
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'

		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	tasks.named('test') {
		// build 를 도커 없이 수초에 끝내려고 통합 테스트를 태그로 떼어낸다.
		useJUnitPlatform { excludeTags 'integration' }
		// 기본값(short)은 단언 메시지를 뺀다.
		testLogging { events 'failed'; exceptionFormat 'full' }
	}

	tasks.register('integrationTest', Test) {
		group = 'verification'
		description = "@Tag('integration') 이 붙은 테스트만 실행한다. 도커 필요."
		testClassesDirs = sourceSets.test.output.classesDirs
		classpath = sourceSets.test.runtimeClasspath
		useJUnitPlatform { includeTags 'integration' }
		shouldRunAfter tasks.named('test')
		testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
	}
}
