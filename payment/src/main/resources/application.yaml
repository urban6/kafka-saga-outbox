server:
  port: 8082

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:mysql://localhost:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: payment_user
    password: payment_pw
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # Debezium 이 datetime 을 UTC 로 읽는다. KST 로 저장하면 메시지가 9시간 미래로 찍힌다.
          time_zone: UTC
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # consumed_message.consumer_group 값. 바꾸면 과거 처리 이력을 못 찾아 전부 재처리된다.
      group-id: payment-service
      # true 면 처리 중 죽은 메시지가 유실된다.
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 50

  task:
    scheduling:
      pool:
        # 배치가 둘이다. 기본 1이면 하나가 늦을 때 다른 하나가 밀린다.
        size: 2

# Mock 이 같은 앱에 있어도 실제 HTTP 로 부른다 — 그래야 타임아웃·연결 끊김이 재현된다.
pg:
  base-url: http://localhost:8082
  connect-timeout: 1s
  read-timeout: 3s

mockpg:
  reject-rate: 0.0
  error-rate: 0.0
  delay-rate: 0.0
  delay: 0s           # pg.read-timeout(3s) 보다 크면 클라이언트는 타임아웃, PG 는 승인 = in-doubt

payment:
  in-doubt:
    scan-interval: 30s
    grace: 30s
    scan-limit: 50
    escalate-after: 5m

# payment 테이블은 지우지 않는다 — 운영 데이터가 아니라 기록이다.
retention:
  scan-interval: 1h
  outbox: 7d
  # Kafka retention 보다 길어야 한다. 짧으면 재전달을 신규로 착각해 이중 청구다.
  consumed-message: 14d
  batch-size: 500
  max-batches-per-run: 20

logging:
  level:
    com.urban6: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.kafka: INFO
