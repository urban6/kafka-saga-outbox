plugins {
	id 'org.springframework.boot'
}

dependencies {
	// 이벤트 계약과 Outbox 는 서비스마다 자기 것을 갖는다. 공유 모듈을 두면 한 서비스가
	// 스키마를 바꿀 때 다른 서비스가 재빌드해야 해서 독립 배포가 깨진다.
	implementation 'com.fasterxml.jackson.core:jackson-annotations'

	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// starter-kafka 를 써야 spring-boot-kafka(오토컨피그)가 따라온다.
	// spring-kafka 만 넣으면 Boot 4 에서는 spring.kafka.* 설정이 통째로 무시된다.
	implementation 'org.springframework.boot:spring-boot-starter-kafka'

	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-kafka'
	testImplementation 'org.testcontainers:testcontainers-mysql'
}

bootJar {
	archiveFileName = 'inventory-api.jar'
}

// 실행 가능한 bootJar만 만든다. 다른 모듈이 참조하지 않으므로 plain jar는 불필요.
jar {
	enabled = false
}
