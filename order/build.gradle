plugins {
	id 'org.springframework.boot'
}

dependencies {
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// Boot 4.1.1 의 actuator 스타터는 spring-boot-starter-micrometer-metrics 를 이미 끌어온다.
	// Kafka 때와 달리 오토컨피그 모듈을 따로 넣을 필요가 없다.
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// starter-kafka 를 써야 spring-boot-kafka(오토컨피그)가 따라온다.
	// spring-kafka 만 넣으면 Boot 4 에서는 spring.kafka.* 가 통째로 무시된다 — 조용히.
	implementation 'org.springframework.boot:spring-boot-starter-kafka'

	runtimeOnly 'com.mysql:mysql-connector-j'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-kafka'
	testImplementation 'org.testcontainers:testcontainers-mysql'
}

bootJar {
	archiveFileName = 'order-api.jar'
}

// 실행 가능한 bootJar만 만든다. 다른 모듈이 참조하지 않으므로 plain jar는 불필요.
jar {
	enabled = false
}
