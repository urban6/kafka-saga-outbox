plugins {
	id 'org.springframework.boot'
}

dependencies {
	// EventEnvelope 의 @JsonCreator/@JsonProperty 용. 애노테이션 아티팩트는 Jackson 2/3 가
	// 같은 패키지(com.fasterxml.jackson.annotation)를 공유하므로 이것만 있으면 된다.
	// databind(tools.jackson) 는 spring-boot-starter-jackson 이 이미 끌어온다.
	implementation 'com.fasterxml.jackson.core:jackson-annotations'

	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.kafka:spring-kafka'

	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-kafka'
	testImplementation 'org.testcontainers:testcontainers-mysql'
}

bootJar {
	archiveFileName = 'order-api.jar'
}

// 실행 가능한 bootJar만 만든다. 다른 모듈이 참조하지 않으므로 plain jar는 불필요.
jar {
	enabled = false
}
