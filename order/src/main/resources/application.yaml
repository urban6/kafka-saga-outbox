spring:
  application:
    name: order

  datasource:
    url: jdbc:mariadb://localhost:3306/order_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      # 스키마는 table.sql로 관리한다. 애플리케이션이 DDL을 건드리지 않는다.
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order
      auto-offset-reset: earliest
    producer:
      acks: all

server:
  port: 8081
