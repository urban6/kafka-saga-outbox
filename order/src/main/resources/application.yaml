server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:mysql://localhost:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: order_user
    password: order_pw
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # 이 DB 의 시각 컬럼은 예외 없이 UTC 로 저장한다.
          # Debezium 이 datetime 컬럼을 UTC 로 읽어 Kafka 메시지 타임스탬프로 쓰기 때문에,
          # KST 를 넣으면 메시지가 9시간 미래로 찍힌다.
          # Instant 는 Hibernate 가 TIMESTAMP_UTC 로 매핑해 이 설정과 무관하게 UTC 로 쓴다.
          # 이 줄은 나중에 LocalDateTime 필드가 섞여 들어와도 규약이 유지되게 하는 방어선이다.
          time_zone: UTC
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # consumed_message.consumer_group 에 그대로 들어가는 값.
      # 바꾸면 과거 처리 이력을 못 찾아 전부 재처리된다.
      group-id: order-service
      # true 면 poll 직후 커밋되어, 처리 중 죽으면 그 메시지는 영영 사라진다.
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 50
    # producer 설정은 두지 않는다. 커맨드는 Outbox INSERT -> Debezium 으로 나간다.

logging:
  level:
    com.urban6: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.kafka: INFO
