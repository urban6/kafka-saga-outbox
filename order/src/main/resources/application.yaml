server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:mysql://localhost:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: order_user
    password: order_pw
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # 이 DB 의 시각 컬럼은 예외 없이 UTC 로 저장한다.
          # Debezium 이 datetime 컬럼을 UTC 로 읽어 Kafka 메시지 타임스탬프로 쓰기 때문에,
          # KST 를 넣으면 메시지가 9시간 미래로 찍힌다.
          # Instant 는 Hibernate 가 TIMESTAMP_UTC 로 매핑해 이 설정과 무관하게 UTC 로 쓴다.
          # 이 줄은 나중에 LocalDateTime 필드가 섞여 들어와도 규약이 유지되게 하는 방어선이다.
          time_zone: UTC
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

  task:
    scheduling:
      pool:
        # 배치가 둘(Stuck 탐지 / 정리)이다. 기본 1이면 하나가 늦을 때 다른 하나가 밀린다.
        size: 2

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # consumed_message.consumer_group 에 그대로 들어가는 값.
      # 바꾸면 과거 처리 이력을 못 찾아 전부 재처리된다.
      group-id: order-service
      # true 면 poll 직후 커밋되어, 처리 중 죽으면 그 메시지는 영영 사라진다.
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 50
    # producer 설정은 두지 않는다. 커맨드는 Outbox INSERT -> Debezium 으로 나간다.

saga:
  stuck:
    # 재시도가 아직 도는 중인 사가를 잡으면 알람 피로만 남는다.
    # 임계값은 Kafka 재시도가 소진되는 시간보다 커야 한다.
    scan-interval: 30s
    default-threshold: 120s
    # 장애 때 수천 건을 로드하면 탐지가 장애를 키운다. 여기서 자른다.
    scan-limit: 100
    thresholds:
      APPROVE_PAYMENT: 60s

# 정리 배치. 기준은 전부 시간이다 — 사가 완료 여부로 지우면 안 된다(발행 여부를 앱이 모른다).
retention:
  scan-interval: 1h
  outbox: 7d
  # Kafka retention(기본 7d) 보다 길어야 한다. 짧으면 재전달된 메시지를 중복 처리한다.
  consumed-message: 14d
  api-idempotency: 7d
  # DELETE 한 번의 상한. 무제한 DELETE 는 락을 오래 잡는다.
  batch-size: 500
  max-batches-per-run: 20

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  level:
    com.urban6: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.kafka: INFO
