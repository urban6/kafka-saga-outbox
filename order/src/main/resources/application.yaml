server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:mysql://localhost:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: order_user
    password: order_pw
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # Debezium 이 datetime 을 UTC 로 읽는다. KST 로 쓰면 메시지가 9시간 미래로 찍힌다.
          time_zone: UTC
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

  task:
    scheduling:
      pool:
        # 배치가 둘이다. 기본 1이면 하나가 늦을 때 다른 하나가 밀린다.
        size: 2

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # consumed_message.consumer_group 값이다. 바꾸면 처리 이력을 못 찾아 전부 재처리된다.
      group-id: order-service
      # true 면 처리 중 죽은 메시지가 유실된다.
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 50
    # 도메인 메시지 프로듀서는 없다(Outbox -> Debezium). DLT 발행만 DeadLetterConfig 가 갖는다.

saga:
  stuck:
    # 임계값은 Kafka 재시도가 소진되는 시간보다 커야 한다.
    scan-interval: 30s
    default-threshold: 120s
    # 장애 때 수천 건을 로드하면 탐지가 장애를 키운다.
    scan-limit: 100
    thresholds:
      APPROVE_PAYMENT: 60s

# 기준은 전부 시간이다. 사가 완료 여부로 지우면 안 된다(발행 여부를 앱이 모른다).
retention:
  scan-interval: 1h
  outbox: 7d
  # Kafka retention 보다 길어야 한다. 짧으면 재전달된 메시지를 중복 처리한다.
  consumed-message: 14d
  api-idempotency: 7d
  # 무제한 DELETE 는 락을 오래 잡는다.
  batch-size: 500
  max-batches-per-run: 20

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  level:
    com.urban6: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.kafka: INFO
