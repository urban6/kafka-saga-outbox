server:
  port: 8081

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:mysql://localhost:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: order_user
    password: order_pw
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # 이 DB 의 시각 컬럼은 예외 없이 UTC 로 저장한다.
          # Debezium 이 datetime 컬럼을 UTC 로 읽어 Kafka 메시지 타임스탬프로 쓰기 때문에,
          # KST 를 넣으면 메시지가 9시간 미래로 찍힌다.
          # Instant 는 Hibernate 가 TIMESTAMP_UTC 로 매핑해 이 설정과 무관하게 UTC 로 쓴다.
          # 이 줄은 나중에 LocalDateTime 필드가 섞여 들어와도 규약이 유지되게 하는 방어선이다.
          time_zone: UTC
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

logging:
  level:
    com.urban6: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
